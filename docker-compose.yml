services:
  web:
    build: .
    command: sh -c "pip install --no-cache-dir -r requirements.txt && gunicorn --bind 0.0.0.0:8000 app:app"
    volumes:
      - .:/usr/src/app
      - ./data:/data:ro
    ports:
      - "8000:8000"
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
